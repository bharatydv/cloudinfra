[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
# B008: FastAPI Depends()/Query() defaults are the framework idiom.
# UP046: Pydantic generics still need Generic[T], not PEP 695 syntax.
ignore = ["B008", "UP046"]

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true
