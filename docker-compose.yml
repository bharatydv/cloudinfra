name: learnbase

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnbase}
      POSTGRES_DB: ${POSTGRES_DB:-learnbase}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Published on 5433 by default so it never clashes with a PostgreSQL
      # already installed on the host. Override with POSTGRES_HOST_PORT.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnbase} -d ${POSTGRES_DB:-learnbase}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the compose network the database is reachable by service name.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-learnbase}:${POSTGRES_PASSWORD:-learnbase}@postgres:5432/${POSTGRES_DB:-learnbase}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-learnbase}:${POSTGRES_PASSWORD:-learnbase}@postgres:5432/${POSTGRES_DB:-learnbase}_test
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Host port is configurable; the container always listens on 8000.
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - media_data:/app/uploads
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    profiles: ["proxy"]

  # Enable with:  docker compose --profile cache up -d
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    profiles: ["cache"]

volumes:
  postgres_data:
  media_data:
  redis_data:
