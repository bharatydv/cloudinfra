# Optional front proxy sitting in front of the frontend and backend containers.
# Enable with:  docker compose --profile proxy up -d
#
# In production, terminate TLS here (certbot / your load balancer) and redirect
# HTTP to HTTPS.

upstream learnbase_frontend {
    server frontend:80;
}

upstream learnbase_backend {
    server backend:8000;
}

# Basic abuse protection at the edge, in addition to application rate limiting.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 12M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://learnbase_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        add_header X-Content-Type-Options "nosniff" always;
    }

    # Crawler files come from the API so they always reflect live content.
    location = /robots.txt {
        proxy_pass http://learnbase_backend/robots.txt;
        proxy_set_header Host $host;
    }

    location = /sitemap.xml {
        proxy_pass http://learnbase_backend/sitemap.xml;
        proxy_set_header Host $host;
    }

    location /media/ {
        proxy_pass http://learnbase_backend/media/;
        proxy_set_header Host $host;
        expires 30d;
    }

    location / {
        proxy_pass http://learnbase_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
