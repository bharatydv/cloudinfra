<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <title>Learn. Get Certified. Build Your Future.</title>
    <meta
      name="description"
      content="Build job-ready skills and prepare for professional certifications with structured courses, practical resources and guided learning paths."
    />

    <!--
      Static social card. The app overwrites these per route once React mounts,
      but most social crawlers (LinkedIn, Slack, WhatsApp, Facebook) never run
      the JavaScript, so without these a shared link has no preview at all.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Inferacloud" />
    <meta property="og:title" content="Learn. Get Certified. Build Your Future." />
    <meta
      property="og:description"
      content="Build job-ready skills and prepare for professional certifications with structured courses, practical resources and guided learning paths."
    />
    <meta property="og:image" content="/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Learn. Get Certified. Build Your Future." />
    <meta
      name="twitter:description"
      content="Build job-ready skills and prepare for professional certifications with structured courses, practical resources and guided learning paths."
    />
    <meta name="twitter:image" content="/og-default.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
